<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Register | Online Shopping Web Application</title><meta charset="UTF-8">
<link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><main class="auth-card">
<h1>Online Shopping Web Application</h1><h2>Create User Account</h2>
<p class="error" th:if="${error}" th:text="${error}"></p>
<form th:action="@{/register}" method="post">
<label>Username</label><input type="text" name="username" required>
<label>Password (minimum 8 characters)</label><input type="password" name="password" minlength="8" required>
<button type="submit">Register</button>
</form><p><a th:href="@{/login}">Already registered? Login</a></p>
</main></body></html>
