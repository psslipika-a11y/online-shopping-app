<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Add Product</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><main class="form-card"><h1>Add a New Product</h1>
<form th:action="@{/save-product}" method="post">
<label>Product Name</label><input type="text" name="name" required>
<label>Description</label><textarea name="description" required></textarea>
<label>Price (₹)</label><input type="number" name="price" min="0.01" step="0.01" required>
<label>Quantity</label><input type="number" name="quantity" min="0" required>
<label>Product Image URL</label><input type="url" name="imageUrl" placeholder="https://...">
<button type="submit">Save Product</button>
</form><a th:href="@{/}">Back to Home</a></main></body></html>
