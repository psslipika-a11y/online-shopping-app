
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Online Shopping Store</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <h1>Welcome to Online Shopping Store</h1>

    <h2>Available Products</h2>

    <a href="/add-product">Add New Product</a>
    |
    <a href="/cart">View Shopping Cart</a>

    <table border="1" cellpadding="10">
        <thead>
            <tr>
                <th>ID</th>
                <th>Product Image</th>
                <th>Product Name</th>
                <th>Description</th>
                <th>Price (₹)</th>
                <th>Quantity</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}"></td>

                <td>
                    <img th:if="${product.imageUrl != null and !product.imageUrl.isEmpty()}"
                         th:src="${product.imageUrl}"
                         th:alt="${product.name}"
                         width="100"
                         height="100"
                         style="object-fit: contain;">

                    <span th:if="${product.imageUrl == null or product.imageUrl.isEmpty()}">
                        No image available
                    </span>
                </td>

                <td th:text="${product.name}"></td>
                <td th:text="${product.description}"></td>
                <td th:text="${product.price}"></td>
                <td th:text="${product.quantity}"></td>

                <td>
                    <form th:action="@{/cart/add/{id}(id=${product.id})}"
                          method="post">
                        <button type="submit"
                                th:disabled="${product.quantity <= 0}">
                            Add to Cart
                        </button>
                    </form>

                    <br>

                    <a th:href="@{/delete-product/{id}(id=${product.id})}">
                        Delete
                    </a>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(products)}">
                <td colspan="7">
                    No products available. Add your first product!
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
