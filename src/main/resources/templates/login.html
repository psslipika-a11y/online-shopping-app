<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Login | Online Shopping Web Application</title><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><main class="auth-card">
<h1>Online Shopping Web Application</h1><h2>Login</h2>
<p class="success" th:if="${param.registered}">Registration successful. Please log in.</p>
<p class="error" th:if="${param.error}">Invalid username or password.</p>
<p class="success" th:if="${param.logout}">You have logged out.</p>
<form th:action="@{/login}" method="post">
<label>Username</label><input type="text" name="username" required autofocus>
<label>Password</label><input type="password" name="password" required>
<button type="submit">Login</button>
</form>
<p>New customer? <a th:href="@{/register}">Create a user account</a></p>
<a th:href="@{/}">Back to Home</a>
</main></body></html>
