
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Shopping Cart</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <h1>Your Shopping Cart</h1>

    <a href="/">Continue Shopping</a>

    <h2>Cart Items</h2>

    <p th:if="${#lists.isEmpty(cartItems)}">
        Your shopping cart is empty.
    </p>

    <table border="1" cellpadding="10"
           th:if="${!#lists.isEmpty(cartItems)}">

        <thead>
            <tr>
                <th>Product Image</th>
                <th>Product Name</th>
                <th>Price (₹)</th>
                <th>Quantity</th>
                <th>Subtotal (₹)</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="item : ${cartItems}">

                <td>
                    <img th:if="${item.product.imageUrl != null and !item.product.imageUrl.isEmpty()}"
                         th:src="${item.product.imageUrl}"
                         th:alt="${item.product.name}"
                         width="80"
                         height="80"
                         style="object-fit: contain;">
                    <span th:if="${item.product.imageUrl == null or item.product.imageUrl.isEmpty()}">
                        No image
                    </span>
                </td>

                <td th:text="${item.product.name}"></td>

                <td th:text="${item.product.price}"></td>

                <td>
                    <form th:action="@{/cart/update/{id}(id=${item.product.id})}"
                          method="post">

                        <input type="number"
                               name="quantity"
                               th:value="${item.quantity}"
                               min="1"
                               th:max="${item.product.quantity}"
                               required>

                        <button type="submit">Update</button>
                    </form>
                </td>

                <td th:text="${item.subtotal}"></td>

                <td>
                    <a th:href="@{/cart/remove/{id}(id=${item.product.id})}">
                        Remove
                    </a>
                </td>

            </tr>
        </tbody>
    </table>

    <h2 th:if="${!#lists.isEmpty(cartItems)}">
        Total Amount: ₹<span th:text="${total}"></span>
    </h2>
    <form th:if="${!#lists.isEmpty(cartItems)}"
      action="/checkout"
      method="get">
    <button type="submit">Proceed to Checkout</button>
</form>

</body>
</html>
